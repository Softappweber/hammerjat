<style>

body{

.row{

input,textarea{
  width:100%;
  border:1px solid #d8dbe0;
  border-radius:8px;
  padding:11px;
  font:inherit

textarea{
  min-height:150px;
  resize:vertical
}

button.primary{

  color:white;
  border:0;

}

button.secondary{
  background:#fff;
  color:#17181a;

  border-radius:8px;

  cursor:pointer
}

.field{
  margin-bottom:12px

.item{

}

.item:first-child{
  border-top:0
}

.item-title{
  font-weight:600;
  margin-bottom:5px
}

.item-meta{
  font-size:12px;
  color:#777;
  margin-top:6px
}

.item a{

}

.empty{

  padding:18px 0
}

.filebox{
  border:1px dashed #bbb;
  border-radius:10px;
  padding:22px;
  text-align:center;
  margin-bottom:12px

@media(max-width:700px){
  nav{
    grid-template-columns:repeat(2,1fr)
  }

  header{
    align-items:flex-start;
    flex-direction:column
  }

</style>

<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzUJSyxY6dc8xVFUMO5xMKZUBuMZ6ZfIyevNysNNmUJ4JNEstWS1-hl3GW8I4ra2mDggQ/exec";


let currentTab = "photos";

/*
   Stores currently loaded items.
   Used by the search function.
*/
let currentItems = [];


/* =====================================================
   TAB SWITCHING
===================================================== */

document.querySelectorAll("nav button").forEach(btn=>{

  btn.onclick=()=>{

    currentTab=btn.dataset.tab;

    document
      .querySelectorAll("nav button")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    document
      .querySelectorAll(".panel")
      .forEach(p=>p.classList.remove("active"));

    document
      .getElementById(currentTab)
      .classList.add("active");

    /*
       Clear search when changing category.
    */
    document.getElementById("searchInput").value="";

    loadItems(currentTab);

  };

});


document
  .querySelector('nav button[data-tab="photos"]')
  .click();


/* =====================================================
   STATUS
===================================================== */

function setStatus(t){

  document
    .getElementById("status")
    .textContent=t;

}


/* =====================================================
   POST TO APPS SCRIPT
===================================================== */

async function post(action,data={}){

  const body=new URLSearchParams({
    action,
    ...data
  });

  const r=await fetch(API_URL,{
    method:"POST",
    body
  });

  return await r.json();

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(type){

  if(!API_URL || API_URL.includes("PASTE_")) return;

  setStatus("Loading...");

  try{

    const callback="cb_"+Date.now();

    const script=document.createElement("script");

    window[callback]=(result)=>{

      delete window[callback];

      script.remove();

      currentItems=result.items||[];

      render(type,currentItems);

      setStatus("Ready");

    };

    script.src=
      API_URL+
      "?action=list&type="+
      encodeURIComponent(type)+
      "&callback="+
      callback;

    document.body.appendChild(script);

  }catch(e){

    setStatus("Load error");

  }

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener("input",function(){

    const query=this.value
      .trim()
      .toLowerCase();

    if(!query){

      render(currentTab,currentItems);

      return;

    }

    const filtered=currentItems.filter(item=>{

      const searchable=[
        item.title,
        item.body,
        item.url,
        item.name,
        item.fileName,
        item.description,
        item.date
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return searchable.includes(query);

    });

    render(currentTab,filtered);

  });


/* =====================================================
   DATE / TIME FORMATTER
===================================================== */

function formatDateTime(value){

  if(!value) return "";

  const date=new Date(value);

  if(isNaN(date.getTime())){

    /*
       If Apps Script already returned a formatted
       string, preserve it instead of destroying it.
    */
    return String(value);

  }

  return date.toLocaleString("en-US",{

    month:"long",
    day:"numeric",
    year:"numeric",

    hour:"numeric",
    minute:"2-digit",

    hour12:true

  });

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function render(type,items){

  const el=document.getElementById(type+"List");

  if(!items.length){

    el.innerHTML=
      '<div class="empty">Nothing found.</div>';

    return;

  }

  el.innerHTML=items.map(x=>{

    const formattedDate=
      formatDateTime(x.date||"");


    if(x.kind==="note"){

      return `
        <div class="item">

          <div class="item-title">
            ${esc(x.title)}
          </div>

          <div>
            ${esc(x.body)}
          </div>

          <div class="item-meta">
            ${esc(formattedDate)}
          </div>

        </div>
      `;

    }


    return `
      <div class="item">

        <div class="item-title">
          ${esc(x.title||x.name||"File")}
        </div>

        ${
          x.url
          ?
          `<a
            href="${escAttr(x.url)}"
            target="_blank"
            rel="noopener"
          >${esc(x.url)}</a>`
          :
          ""
        }

        ${
          x.url
          ?
          ""
          :
          x.fileUrl
          ?
          `<a
            href="${escAttr(x.fileUrl)}"
            target="_blank"
          >Open file</a>`
          :
          ""
        }

        <div class="item-meta">
          ${esc(formattedDate)}
        </div>

      </div>
    `;

  }).join("");

}


/* =====================================================
   SAVE BOOKMARK
===================================================== */

async function saveBookmark(){

  const title=
    document
      .getElementById("bookmarkTitle")
      .value
      .trim();

  const url=
    document
      .getElementById("bookmarkUrl")
      .value
      .trim();

  if(!title||!url)
    return alert("Enter title and URL.");

  setStatus("Saving...");

  try{

    await post("save",{
      type:"bookmarks",
      title,
      url
    });

    document.getElementById("bookmarkTitle").value="";
    document.getElementById("bookmarkUrl").value="";

    await loadItems("bookmarks");

  }catch(e){

    setStatus("Save error");

  }

}


/* =====================================================
   SAVE LINK
===================================================== */

async function saveLink(){

  const title=
    document
      .getElementById("linkTitle")
      .value
      .trim();

  const url=
    document
      .getElementById("linkUrl")
      .value
      .trim();

  if(!title||!url)
    return alert("Enter title and URL.");

  setStatus("Saving...");

  try{

    await post("save",{
      type:"links",
      title,
      url
    });

    document.getElementById("linkTitle").value="";
    document.getElementById("linkUrl").value="";

    await loadItems("links");

  }catch(e){

    setStatus("Save error");

  }

}


/* =====================================================
   SAVE NOTE
===================================================== */

async function saveNote(){

  const title=
    document
      .getElementById("noteTitle")
      .value
      .trim();

  const body=
    document
      .getElementById("noteBody")
      .value
      .trim();

  if(!title||!body)
    return alert("Enter title and note.");

  setStatus("Saving...");

  try{

    await post("save",{
      type:"notes",
      title,
      body
    });

    document.getElementById("noteTitle").value="";
    document.getElementById("noteBody").value="";

    await loadItems("notes");

  }catch(e){

    setStatus("Save error");

  }

}


/* =====================================================
   FILE UPLOAD
===================================================== */

async function uploadFiles(inputId,type){

  const files=[
    ...document
      .getElementById(inputId)
      .files
  ];

  if(!files.length)
    return alert("Choose a file first.");

  for(const file of files){

    if(file.size>20*1024*1024){

      alert(
        file.name+
        " is over the 20 MB per-file limit."
      );

      continue;

    }

    setStatus(
      "Uploading "+file.name+"..."
    );

    const base64=
      await toBase64(file);

    try{

      await post("upload",{

        type,

        name:file.name,

        mimeType:
          file.type||
          "application/octet-stream",

        data:base64

      });

    }catch(e){

      alert(
        "Upload failed: "+
        file.name
      );

    }

  }

  document
    .getElementById(inputId)
    .value="";

  await loadItems(type);

  setStatus("Ready");

}


/* =====================================================
   BASE64
===================================================== */

function toBase64(file){

  return new Promise((resolve,reject)=>{

    const r=new FileReader();

    r.onload=()=>{

      resolve(
        String(r.result).split(",")[1]
      );

    };

    r.onerror=reject;

    r.readAsDataURL(file);

  });

}


/* =====================================================
   HTML ESCAPING
===================================================== */

function esc(s){

  return String(s??"")
    .replace(
      /[&<>"']/g,
      m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m])
    );

}


function escAttr(s){

  return esc(s);

}

</script>
