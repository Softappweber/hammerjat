<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Personal Storage</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f7f9;
  color:#17181a
}

.app{
  max-width:1050px;
  margin:auto;
  padding:28px 18px 60px
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px
}

h1{
  font-size:22px;
  margin:0;
  font-weight:600
}

#status{
  font-size:12px;
  color:#777
}

nav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:22px
}

nav button{
  border:1px solid #ddd;
  background:#fff;
  padding:14px 8px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px
}

nav button.active{
  background:#17181a;
  color:#fff;
  border-color:#17181a
}

.panel{
  display:none;
  background:#fff;
  border:1px solid #e3e5e8;
  border-radius:14px;
  padding:22px
}

.panel.active{
  display:block
}

.panel h2{
  font-size:18px;
  margin:0 0 18px
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

input,textarea{
  width:100%;
  border:1px solid #d8dbe0;
  border-radius:8px;
  padding:11px;
  font:inherit
}

textarea{
  min-height:150px;
  resize:vertical
}

button.primary{
  background:#17181a;
  color:white;
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer
}

button.secondary{
  background:#fff;
  color:#17181a;
  border:1px solid #d8dbe0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer
}

.field{
  margin-bottom:12px
}

.item{
  border-top:1px solid #eee;
  padding:14px 0
}

.item:first-child{
  border-top:0
}

.item-title{
  font-weight:600;
  margin-bottom:5px;
  word-break:break-word
}

.item-meta{
  font-size:12px;
  color:#777;
  margin-top:7px
}

.item a{
  color:inherit
}

.empty{
  color:#888;
  padding:18px 0
}

.filebox{
  border:1px dashed #bbb;
  border-radius:10px;
  padding:22px;
  text-align:center;
  margin-bottom:12px
}


/* ==========================================
   ITEM ACTIONS
   ========================================== */

.item-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px
}

.item-actions button{
  border-radius:7px;
  padding:7px 11px;
  font-size:12px;
  cursor:pointer
}

.rename-btn{
  background:#fff;
  border:1px solid #d8dbe0;
  color:#17181a
}

.open-btn{
  background:#17181a;
  border:1px solid #17181a;
  color:#fff;
  text-decoration:none;
  display:inline-flex;
  align-items:center
}


/* ==========================================
   RENAME MODAL
   ========================================== */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:9999
}

.modal-overlay.show{
  display:flex
}

.rename-modal{
  width:min(430px,100%);
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 18px 60px rgba(0,0,0,.2)
}

.rename-modal h3{
  margin:0 0 7px;
  font-size:18px
}

.rename-modal p{
  margin:0 0 17px;
  color:#777;
  font-size:13px
}

.rename-modal input{
  margin-bottom:16px
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px
}

.modal-actions button{
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer
}

.modal-cancel{
  background:#fff;
  border:1px solid #d8dbe0
}

.modal-save{
  background:#17181a;
  color:#fff;
  border:1px solid #17181a
}

.modal-save:disabled{
  opacity:.5;
  cursor:not-allowed
}


@media(max-width:700px){

  nav{
    grid-template-columns:repeat(2,1fr)
  }

  .item-actions{
    width:100%
  }

}

</style>
</head>

<body>

<div class="app">

<header>

  <h1>My Personal Storage</h1>

  <span id="status">Ready</span>

</header>


<nav>

  <button data-tab="photos">
    Photos
  </button>

  <button data-tab="bookmarks">
    Bookmarks
  </button>

  <button data-tab="notes">
    Notes
  </button>

  <button data-tab="links">
    Links
  </button>

  <button data-tab="files">
    File Upload
  </button>

</nav>


<!-- ==========================================
     PHOTOS
     ========================================== -->

<section id="photos" class="panel">

  <h2>Photos</h2>

  <div class="filebox">

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      multiple
    >

  </div>

  <button
    class="primary"
    onclick="uploadFiles('photoInput','photos')"
  >
    Upload Photos
  </button>

  <div id="photosList"></div>

</section>


<!-- ==========================================
     BOOKMARKS
     ========================================== -->

<section id="bookmarks" class="panel">

  <h2>Bookmarks</h2>

  <div class="field">

    <input
      id="bookmarkTitle"
      placeholder="Title"
    >

  </div>

  <div class="field">

    <input
      id="bookmarkUrl"
      placeholder="https://example.com"
    >

  </div>

  <button
    class="primary"
    onclick="saveBookmark()"
  >
    Save Bookmark
  </button>

  <div id="bookmarksList"></div>

</section>


<!-- ==========================================
     NOTES
     ========================================== -->

<section id="notes" class="panel">

  <h2>Notes</h2>

  <div class="field">

    <input
      id="noteTitle"
      placeholder="Title"
    >

  </div>

  <div class="field">

    <textarea
      id="noteBody"
      placeholder="Write your note..."
    ></textarea>

  </div>

  <button
    class="primary"
    onclick="saveNote()"
  >
    Save Note
  </button>

  <div id="notesList"></div>

</section>


<!-- ==========================================
     LINKS
     ========================================== -->

<section id="links" class="panel">

  <h2>Links</h2>

  <div class="field">

    <input
      id="linkTitle"
      placeholder="Title"
    >

  </div>

  <div class="field">

    <input
      id="linkUrl"
      placeholder="https://example.com"
    >

  </div>

  <button
    class="primary"
    onclick="saveLink()"
  >
    Save Link
  </button>

  <div id="linksList"></div>

</section>


<!-- ==========================================
     FILES
     ========================================== -->

<section id="files" class="panel">

  <h2>File Upload</h2>

  <div class="filebox">

    <input
      id="fileInput"
      type="file"
      multiple
    >

  </div>

  <button
    class="primary"
    onclick="uploadFiles('fileInput','files')"
  >
    Upload Files
  </button>

  <div id="filesList"></div>

</section>

</div>


<!-- ==========================================
     RENAME MODAL
     ========================================== -->

<div
  id="renameOverlay"
  class="modal-overlay"
>

  <div
    class="rename-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="renameHeading"
  >

    <h3 id="renameHeading">
      Rename Item
    </h3>

    <p>
      Enter the new name for this item.
    </p>

    <input
      id="renameInput"
      type="text"
      autocomplete="off"
      placeholder="New name"
    >

    <div class="modal-actions">

      <button
        class="modal-cancel"
        onclick="closeRenameModal()"
      >
        Cancel
      </button>

      <button
        id="renameSaveButton"
        class="modal-save"
        onclick="submitRename()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT WEB APP URL
   ========================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxK8I5v13lopBY26DIBBUDnBTr8j19rbOpiMvVnun30PvUIq_LryEJwXYP-OGo3Tpw/exec";


let currentTab = "photos";

let renameState = {
  type: "",
  id: "",
  originalName: ""
};


/* ==========================================
   NAVIGATION
   ========================================== */

document
  .querySelectorAll("nav button")
  .forEach(btn => {

    btn.onclick = () => {

      currentTab = btn.dataset.tab;

      document
        .querySelectorAll("nav button")
        .forEach(b =>
          b.classList.remove("active")
        );

      btn.classList.add("active");

      document
        .querySelectorAll(".panel")
        .forEach(p =>
          p.classList.remove("active")
        );

      document
        .getElementById(currentTab)
        .classList.add("active");

      loadItems(currentTab);

    };

  });


document
  .querySelector(
    'nav button[data-tab="photos"]'
  )
  .click();


/* ==========================================
   STATUS
   ========================================== */

function setStatus(t){

  document.getElementById("status")
    .textContent = t;

}


/* ==========================================
   POST REQUEST
   ========================================== */

async function post(action, data = {}){

  const body =
    new URLSearchParams({
      action,
      ...data
    });

  const r = await fetch(
    API_URL,
    {
      method:"POST",
      body
    }
  );

  const result = await r.json();

  if(!result.ok){

    throw new Error(
      result.error || "Operation failed."
    );

  }

  return result;

}


/* ==========================================
   LOAD ITEMS
   ========================================== */

async function loadItems(type){

  if(
    !API_URL ||
    API_URL.includes("PASTE_")
  ){

    return;

  }


  setStatus("Loading...");


  try{

    const callback =
      "cb_" + Date.now();


    const script =
      document.createElement("script");


    window[callback] = result => {

      delete window[callback];

      script.remove();


      render(
        type,
        result.items || []
      );


      setStatus("Ready");

    };


    script.src =
      API_URL +
      "?action=list&type=" +
      encodeURIComponent(type) +
      "&callback=" +
      callback;


    document.body.appendChild(script);


  }catch(e){

    console.error(e);

    setStatus("Load error");

  }

}


/* ==========================================
   RENDER ITEMS
   ========================================== */

function render(type, items){

  const el =
    document.getElementById(
      type + "List"
    );


  if(!items.length){

    el.innerHTML =
      '<div class="empty">' +
      'Nothing saved yet.' +
      '</div>';

    return;

  }


  el.innerHTML =
    items.map(x => {

      const title =
        x.title ||
        x.name ||
        "File";


      const safeTitle =
        esc(title);


      let content = "";


      // --------------------------------------
      // NOTE
      // --------------------------------------

      if(x.kind === "note"){

        content = `

          <div class="item-title">
            ${safeTitle}
          </div>

          <div>
            ${esc(x.body || "")}
          </div>

          <div class="item-meta">
            ${esc(x.date || "")}
          </div>

        `;

      }

      // --------------------------------------
      // BOOKMARK / LINK
      // --------------------------------------

      else if(x.url){

        content = `

          <div class="item-title">
            ${safeTitle}
          </div>

          <a
            href="${escAttr(x.url)}"
            target="_blank"
            rel="noopener"
          >
            ${esc(x.url)}
          </a>

          <div class="item-meta">
            ${esc(x.date || "")}
          </div>

        `;

      }

      // --------------------------------------
      // FILE / PHOTO
      // --------------------------------------

      else {

        content = `

          <div class="item-title">
            ${safeTitle}
          </div>

          ${
            x.fileUrl
              ? `
                <a
                  class="open-btn"
                  href="${escAttr(x.fileUrl)}"
                  target="_blank"
                  rel="noopener"
                >
                  Open File
                </a>
              `
              : ""
          }

          <div class="item-meta">
            ${esc(x.date || "")}
          </div>

        `;

      }


      // --------------------------------------
      // ACTION BUTTON
      // --------------------------------------

      content += `

        <div class="item-actions">

          <button
            class="rename-btn"
            onclick='openRenameModal(
              ${JSON.stringify(type)},
              ${JSON.stringify(x.id || "")},
              ${JSON.stringify(title)}
            )'
          >
            Rename
          </button>

        </div>

      `;


      return `
        <div class="item">
          ${content}
        </div>
      `;

    }).join("");

}


/* ==========================================
   SAVE BOOKMARK
   ========================================== */

async function saveBookmark(){

  const title =
    document
      .getElementById("bookmarkTitle")
      .value
      .trim();


  const url =
    document
      .getElementById("bookmarkUrl")
      .value
      .trim();


  if(!title || !url){

    return alert(
      "Enter title and URL."
    );

  }


  setStatus("Saving...");


  try{

    await post(
      "save",
      {
        type:"bookmarks",
        title,
        url
      }
    );


    document
      .getElementById("bookmarkTitle")
      .value = "";


    document
      .getElementById("bookmarkUrl")
      .value = "";


    await loadItems("bookmarks");


  }catch(e){

    console.error(e);

    alert(
      "Save error: " + e.message
    );

    setStatus("Save error");

  }

}


/* ==========================================
   SAVE LINK
   ========================================== */

async function saveLink(){

  const title =
    document
      .getElementById("linkTitle")
      .value
      .trim();


  const url =
    document
      .getElementById("linkUrl")
      .value
      .trim();


  if(!title || !url){

    return alert(
      "Enter title and URL."
    );

  }


  setStatus("Saving...");


  try{

    await post(
      "save",
      {
        type:"links",
        title,
        url
      }
    );


    document
      .getElementById("linkTitle")
      .value = "";


    document
      .getElementById("linkUrl")
      .value = "";


    await loadItems("links");


  }catch(e){

    console.error(e);

    alert(
      "Save error: " + e.message
    );

    setStatus("Save error");

  }

}


/* ==========================================
   SAVE NOTE
   ========================================== */

async function saveNote(){

  const title =
    document
      .getElementById("noteTitle")
      .value
      .trim();


  const body =
    document
      .getElementById("noteBody")
      .value
      .trim();


  if(!title || !body){

    return alert(
      "Enter title and note."
    );

  }


  setStatus("Saving...");


  try{

    await post(
      "save",
      {
        type:"notes",
        title,
        body
      }
    );


    document
      .getElementById("noteTitle")
      .value = "";


    document
      .getElementById("noteBody")
      .value = "";


    await loadItems("notes");


  }catch(e){

    console.error(e);

    alert(
      "Save error: " + e.message
    );

    setStatus("Save error");

  }

}


/* ==========================================
   UPLOAD FILES
   ========================================== */

async function uploadFiles(
  inputId,
  type
){

  const files = [
    ...document
      .getElementById(inputId)
      .files
  ];


  if(!files.length){

    return alert(
      "Choose a file first."
    );

  }


  for(const file of files){

    if(
      file.size >
      20 * 1024 * 1024
    ){

      alert(
        file.name +
        " is over the 20 MB per-file limit."
      );

      continue;

    }


    setStatus(
      "Uploading " +
      file.name +
      "..."
    );


    const base64 =
      await toBase64(file);


    try{

      await post(
        "upload",
        {
          type,
          name:file.name,
          mimeType:
            file.type ||
            "application/octet-stream",
          data:base64
        }
      );


    }catch(e){

      console.error(e);

      alert(
        "Upload failed: " +
        file.name +
        "\n\n" +
        e.message
      );

    }

  }


  document
    .getElementById(inputId)
    .value = "";


  await loadItems(type);


  setStatus("Ready");

}


/* ==========================================
   FILE → BASE64
   ========================================== */

function toBase64(file){

  return new Promise(
    (resolve,reject) => {

      const r =
        new FileReader();


      r.onload = () =>
        resolve(
          String(r.result)
            .split(",")[1]
        );


      r.onerror = reject;


      r.readAsDataURL(file);

    }
  );

}


/* ==========================================
   OPEN RENAME MODAL
   ========================================== */

function openRenameModal(
  type,
  id,
  currentName
){

  if(!id){

    alert(
      "This item does not have a storage ID. " +
      "Refresh the page and try again."
    );

    return;

  }


  renameState = {

    type:type,

    id:id,

    originalName:currentName

  };


  document
    .getElementById("renameInput")
    .value = currentName;


  document
    .getElementById("renameOverlay")
    .classList.add("show");


  const input =
    document.getElementById(
      "renameInput"
    );


  setTimeout(() => {

    input.focus();

    input.select();

  }, 50);

}


/* ==========================================
   CLOSE RENAME MODAL
   ========================================== */

function closeRenameModal(){

  document
    .getElementById("renameOverlay")
    .classList.remove("show");


  renameState = {

    type:"",
    id:"",
    originalName:""

  };

}


/* ==========================================
   SUBMIT RENAME
   ========================================== */

async function submitRename(){

  const input =
    document.getElementById(
      "renameInput"
    );


  const newName =
    input.value.trim();


  if(!newName){

    alert(
      "Enter a new name."
    );

    input.focus();

    return;

  }


  if(
    newName ===
    renameState.originalName
  ){

    closeRenameModal();

    return;

  }


  const saveButton =
    document.getElementById(
      "renameSaveButton"
    );


  saveButton.disabled = true;

  setStatus("Renaming...");


  try{

    const result =
      await post(
        "rename",
        {
          type:renameState.type,
          id:renameState.id,
          newName:newName
        }
      );


    closeRenameModal();


    await loadItems(
      renameState.type
    );


    setStatus("Renamed");


  }catch(e){

    console.error(e);

    alert(
      "Rename failed:\n\n" +
      e.message
    );

    setStatus("Rename error");

  }finally{

    saveButton.disabled = false;

  }

}


/* ==========================================
   CLOSE MODAL BY CLICKING OUTSIDE
   ========================================== */

document
  .getElementById("renameOverlay")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeRenameModal();

      }

    }
  );


/* ==========================================
   ESC KEY CLOSES MODAL
   ========================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Escape" &&
      document
        .getElementById(
          "renameOverlay"
        )
        .classList.contains("show")
    ){

      closeRenameModal();

    }

  }
);


/* ==========================================
   ENTER KEY SAVES RENAME
   ========================================== */

document
  .getElementById("renameInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        e.preventDefault();

        submitRename();

      }

    }
  );


/* ==========================================
   HTML ESCAPING
   ========================================== */

function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m])
    );

}


function escAttr(s){

  return esc(s);

}

</script>

</body>
</html>
