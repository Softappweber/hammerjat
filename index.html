<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Storage</title>
<style>
:root{
  --bg:#0a0a0f;
  --surface:#131318;
  --surface2:#1a1a22;
  --border:#23232e;
  --text:#f5f5f7;
  --text2:#a1a1aa;
  --text3:#6b6b76;
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --danger:#ef4444;
  --success:#10b981;
  --radius:14px;
  --radius-lg:20px;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
  --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}

[data-theme="light"]{
  --bg:#f8f9fc;
  --surface:#ffffff;
  --surface2:#f1f2f6;
  --border:#e5e7eb;
  --text:#111113;
  --text2:#55555e;
  --text3:#9a9aa5;
  --shadow:0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg:0 20px 50px rgba(0,0,0,0.1);
}

[data-theme="ocean"]{
  --bg:#0c1a2d;
  --surface:#10233d;
  --surface2:#16314f;
  --border:#1e4264;
  --text:#e8f0fa;
  --text2:#9ab8d8;
  --text3:#5a7d9e;
  --accent:#0ea5e9;
  --accent2:#3b82f6;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
}

[data-theme="forest"]{
  --bg:#0d1a12;
  --surface:#132619;
  --surface2:#1a3320;
  --border:#23452b;
  --text:#e8f5ec;
  --text2:#a3c9b0;
  --text3:#5e8c6d;
  --accent:#22c55e;
  --accent2:#16a34a;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
}

[data-theme="sunset"]{
  --bg:#1a0f0f;
  --surface:#261414;
  --surface2:#331b1b;
  --border:#452525;
  --text:#faf0f0;
  --text2:#c9a3a3;
  --text3:#8e5e5e;
  --accent:#f97316;
  --accent2:#ef4444;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background 0.4s ease,color 0.4s ease;
}

.app{max-width:1200px;margin:auto;padding:24px 20px 60px}

/* ============ UPLOAD PROGRESS BAR ============ */
#uploadProgressContainer{
  position:fixed;
  top:0;left:0;width:100%;
  z-index:9999;
  display:none;
}
#uploadProgressContainer.active{display:block}
#uploadProgressBar{
  height:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  width:0%;
  transition:width 0.3s ease;
  box-shadow:0 0 20px rgba(99,102,241,0.6);
}
#uploadProgressText{
  position:fixed;
  top:12px;right:16px;
  background:var(--surface);
  color:var(--text);
  padding:10px 18px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
  z-index:9999;
  display:none;
}
#uploadProgressText.active{display:block}

/* ============ HEADER ============ */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
  padding:20px 24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}

.brand{display:flex;align-items:center;gap:14px}
.brand-icon{
  width:42px;height:42px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#fff;
}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-0.4px}
.brand p{font-size:11px;color:var(--text3);margin-top:2px}

.header-right{display:flex;align-items:center;gap:10px}

#status{
  font-size:11px;color:var(--text2);
  background:var(--surface2);
  padding:6px 14px;border-radius:20px;
  border:1px solid var(--border);
  font-weight:500;
}

.theme-select{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 12px;
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  font-weight:500;
  transition:var(--transition);
}
.theme-select:focus{outline:none;border-color:var(--accent)}
.theme-select option{background:var(--surface);color:var(--text)}

/* ============ NAVIGATION ============ */
nav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-bottom:24px;
  background:var(--surface);
  padding:6px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}
nav button{
  border:0;
  background:transparent;
  padding:12px 8px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  color:var(--text2);
  transition:var(--transition);
  letter-spacing:0.2px;
}
nav button:hover{background:var(--surface2);color:var(--text)}
nav button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-weight:600;
  box-shadow:0 8px 20px rgba(99,102,241,0.3);
}

/* ============ PANELS ============ */
.panel{
  display:none;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:28px;
  box-shadow:var(--shadow);
}
.panel.active{display:block;animation:panelIn 0.35s cubic-bezier(0.4,0,0.2,1)}
@keyframes panelIn{
  from{opacity:0;transform:translateY(12px) scale(0.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.panel h2{
  font-size:18px;
  margin:0 0 20px;
  font-weight:600;
  letter-spacing:-0.3px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* ============ INPUTS ============ */
input,textarea{
  width:100%;
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
  font:inherit;
  font-size:14px;
  background:var(--surface2);
  color:var(--text);
  transition:var(--transition);
}
input:focus,textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(99,102,241,0.15);
  background:var(--surface);
}
textarea{min-height:150px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--text3)}

/* ============ BUTTONS ============ */
button.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:0;
  border-radius:10px;
  padding:12px 24px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:var(--transition);
  letter-spacing:0.2px;
}
button.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(99,102,241,0.4);
}
button.primary:active{transform:translateY(0)}

/* ============ FIELDS ============ */
.field{margin-bottom:14px}

/* ============ FILEBOX ============ */
.filebox{
  border:2px dashed var(--border);
  border-radius:var(--radius);
  padding:36px;
  text-align:center;
  margin-bottom:16px;
  cursor:pointer;
  transition:var(--transition);
  background:var(--surface2);
}
.filebox:hover{
  border-color:var(--accent);
  background:var(--surface);
  transform:scale(1.01);
}
.filebox-label{
  font-size:14px;
  color:var(--text2);
  font-weight:500;
}
.filebox input{display:none}

/* ============ ITEMS ============ */
.item{
  border-top:1px solid var(--border);
  padding:16px 0;
  transition:var(--transition);
  border-radius:8px;
  position:relative;
}
.item:first-child{border-top:0}
.item:hover{
  background:var(--surface2);
  margin:0 -12px;
  padding:16px 12px;
}
.item-title{font-weight:600;margin-bottom:6px;font-size:14px;color:var(--text)}
.item-meta{font-size:11px;color:var(--text3);margin-top:4px}
.item a{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:var(--transition);
  font-size:13px;
}
.item a:hover{border-bottom-color:var(--accent)}
.item-actions{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  gap:6px;
  opacity:0;
  transition:var(--transition);
}
.item:hover .item-actions{opacity:1}
.item-action-btn{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
  font-size:12px;
  color:var(--text2);
  transition:var(--transition);
}
.item-action-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--surface2);
}
.empty{
  color:var(--text3);
  padding:28px 0;
  text-align:center;
  font-size:14px;
  background:var(--surface2);
  border-radius:10px;
  border:1px dashed var(--border);
}

/* ============ RESPONSIVE ============ */
@media(max-width:700px){
  nav{grid-template-columns:repeat(2,1fr);gap:4px}
  header{flex-direction:column;align-items:flex-start;gap:14px}
  .header-right{width:100%;justify-content:space-between;flex-wrap:wrap}
  .panel{padding:18px}
  .filebox{padding:24px}
}
</style>
</head>
<body>

<div id="uploadProgressBar"></div>
<div id="uploadProgressText">Uploading...</div>

<div class="app">

<header>
  <div class="brand">
    <div class="brand-icon">S</div>
    <div>
      <h1>My Storage</h1>
      <p>Personal Cloud Space</p>
    </div>
  </div>
  <div class="header-right">
    <span id="status">Ready</span>
    <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
      <option value="dark">🌙 Dark</option>
      <option value="light">☀️ Light</option>
      <option value="ocean">🌊 Ocean</option>
      <option value="forest">🌲 Forest</option>
      <option value="sunset">🌅 Sunset</option>
    </select>
  </div>
</header>

<nav>
  <button data-tab="photos">📸 Photos</button>
  <button data-tab="bookmarks">🔖 Bookmarks</button>
  <button data-tab="notes">📝 Notes</button>
  <button data-tab="links">🔗 Links</button>
  <button data-tab="files">📁 Files</button>
</nav>

<section id="photos" class="panel">
  <h2>📸 Photos</h2>
  <div class="filebox" onclick="document.getElementById('photoInput').click()">
    <div class="filebox-label">Click to choose photos</div>
    <input id="photoInput" type="file" accept="image/*" multiple>
  </div>
  <button class="primary" onclick="uploadFiles('photoInput','photos')">Upload Photos</button>
  <div id="photosList"></div>
</section>

<section id="bookmarks" class="panel">
  <h2>🔖 Bookmarks</h2>
  <div class="field"><input id="bookmarkTitle" placeholder="Title"></div>
  <div class="field"><input id="bookmarkUrl" placeholder="https://example.com"></div>
  <button class="primary" onclick="saveBookmark()">Save Bookmark</button>
  <div id="bookmarksList"></div>
</section>

<section id="notes" class="panel">
  <h2>📝 Notes</h2>
  <div class="field"><input id="noteTitle" placeholder="Title"></div>
  <div class="field"><textarea id="noteBody" placeholder="Write your note..."></textarea></div>
  <button class="primary" onclick="saveNote()">Save Note</button>
  <div id="notesList"></div>
</section>

<section id="links" class="panel">
  <h2>🔗 Links</h2>
  <div class="field"><input id="linkTitle" placeholder="Title"></div>
  <div class="field"><input id="linkUrl" placeholder="https://example.com"></div>
  <button class="primary" onclick="saveLink()">Save Link</button>
  <div id="linksList"></div>
</section>

<section id="files" class="panel">
  <h2>📁 Files</h2>
  <div class="filebox" onclick="document.getElementById('fileInput').click()">
    <div class="filebox-label">Click to choose files</div>
    <input id="fileInput" type="file" multiple>
  </div>
  <button class="primary" onclick="uploadFiles('fileInput','files')">Upload Files</button>
  <div id="filesList"></div>
</section>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyOabq5ebmFfPCchiKdyofatDktx6SNpZeuala9jxaU1Z3h9ceeyCIYziISqiNNEHJPbA/exec";

let currentTab = "photos";

// ============ THEME SYSTEM ============
function changeTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
}

// Load saved theme
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('themeSelect').value = savedTheme;

// ============ NAVIGATION ============
document.querySelectorAll("nav button").forEach(btn=>{
  btn.onclick=()=>{
    currentTab=btn.dataset.tab;
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById(currentTab).classList.add("active");
    loadItems(currentTab);
  };
});

document.querySelector('nav button[data-tab="photos"]').click();

function setStatus(t){document.getElementById("status").textContent=t}

async function post(action,data={}){
  const body=new URLSearchParams({action,...data});
  const r=await fetch(API_URL,{method:"POST",body});
  return await r.json();
}

// ============ PREMIUM DATE FORMAT ============
function formatPremiumDate(dateStr){
  const d = new Date(dateStr);
  const day = d.getDate();
  const month = d.toLocaleString('en-US', {month:'long'});
  const year = d.getFullYear();
  const weekday = d.toLocaleString('en-US', {weekday:'long'});
  
  let suffix = 'th';
  if(day === 1 || day === 21 || day === 31) suffix = 'st';
  else if(day === 2 || day === 22) suffix = 'nd';
  else if(day === 3 || day === 23) suffix = 'rd';
  
  const hours = d.getHours();
  const minutes = d.getMinutes();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  const hours12 = hours % 12 || 12;
  const minutesStr = minutes < 10 ? '0' + minutes : minutes;
  
  return `${day}${suffix} ${month} ${year}, ${weekday}, ${hours12}:${minutesStr} ${ampm}`;
}

// ============ UPLOAD PROGRESS ============
function showUploadProgress(show, percent = 0){
  const bar = document.getElementById('uploadProgressBar');
  const text = document.getElementById('uploadProgressText');
  
  if(show){
    bar.parentElement.classList.add('active');
    bar.style.width = percent + '%';
    text.classList.add('active');
    text.textContent = 'Uploading... ' + Math.round(percent) + '%';
  } else {
    bar.parentElement.classList.remove('active');
    bar.style.width = '0%';
    text.classList.remove('active');
  }
}

// ============ LOAD ITEMS ============
async function loadItems(type){
  if(!API_URL || API_URL.includes("PASTE_")) return;
  setStatus("Loading...");
  try{
    const callback="cb_"+Date.now();
    const script=document.createElement("script");
    window[callback]=(result)=>{
      delete window[callback];
      script.remove();
      render(type,result.items||[]);
      setStatus("Ready");
    };
    script.src=API_URL+"?action=list&type="+encodeURIComponent(type)+"&callback="+callback;
    document.body.appendChild(script);
  }catch(e){setStatus("Load error")}
}

// ============ RENDER ITEMS ============
function render(type,items){
  const el=document.getElementById(type+"List");
  if(!items.length){el.innerHTML='<div class="empty">Nothing saved yet.</div>';return}
  
  el.innerHTML=items.map((x, index)=>{
    const dateStr = x.date || '';
    const formattedDate = dateStr ? formatPremiumDate(dateStr) : '';
    
    if(x.kind==="note"){
      return `<div class="item">
        <div class="item-title">${esc(x.title)}</div>
        <div>${esc(x.body)}</div>
        <div class="item-meta">${formattedDate}</div>
      </div>`;
    }
    
    if(x.url){
      // Bookmark or Link
      return `<div class="item">
        <div class="item-title">${esc(x.title)}</div>
        <a href="${escAttr(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>
        <div class="item-meta">${formattedDate}</div>
      </div>`;
    }
    
    // File
    return `<div class="item">
      <div class="item-title">${esc(x.name || "File")}</div>
      ${x.fileUrl ? `<a href="${escAttr(x.fileUrl)}" target="_blank">Open file</a>` : ''}
      <div class="item-meta">${formattedDate}</div>
      <div class="item-actions">
        <button class="item-action-btn" onclick="renameFile('${type}', ${index}, '${esc(x.id || '')}')">✏️ Rename</button>
      </div>
    </div>`;
  }).join("");
}

// ============ RENAME FILE ============
async function renameFile(type, index, fileId){
  const oldName = fileId || 'file';
  const newName = prompt('Enter new name:', oldName.replace(/\.[^.]+$/, ''));
  if(!newName || newName === oldName) return;
  
  setStatus("Renaming...");
  try{
    await post("rename", {type, index, newName});
    await loadItems(type);
    setStatus("Renamed!");
  }catch(e){
    setStatus("Rename error");
    alert("Rename failed");
  }
}

// ============ SAVE FUNCTIONS ============
async function saveBookmark(){
  const title=document.getElementById("bookmarkTitle").value.trim();
  const url=document.getElementById("bookmarkUrl").value.trim();
  if(!title||!url)return alert("Enter title and URL.");
  setStatus("Saving...");
  try{
    await post("save",{type:"bookmarks",title,url});
    document.getElementById("bookmarkTitle").value="";
    document.getElementById("bookmarkUrl").value="";
    await loadItems("bookmarks");
  }catch(e){setStatus("Save error")}
}

async function saveLink(){
  const title=document.getElementById("linkTitle").value.trim();
  const url=document.getElementById("linkUrl").value.trim();
  if(!title||!url)return alert("Enter title and URL.");
  setStatus("Saving...");
  try{
    await post("save",{type:"links",title,url});
    document.getElementById("linkTitle").value="";
    document.getElementById("linkUrl").value="";
    await loadItems("links");
  }catch(e){setStatus("Save error")}
}

async function saveNote(){
  const title=document.getElementById("noteTitle").value.trim();
  const body=document.getElementById("noteBody").value.trim();
  if(!title||!body)return alert("Enter title and note.");
  setStatus("Saving...");
  try{
    await post("save",{type:"notes",title,body});
    document.getElementById("noteTitle").value="";
    document.getElementById("noteBody").value="";
    await loadItems("notes");
  }catch(e){setStatus("Save error")}
}

// ============ UPLOAD FILES ============
async function uploadFiles(inputId,type){
  const files=[...document.getElementById(inputId).files];
  if(!files.length)return alert("Choose a file first.");
  
  const totalFiles = files.length;
  let completedFiles = 0;
  
  for(const file of files){
    if(file.size>20*1024*1024){
      alert(file.name+" is over the 20 MB per-file limit.");
      continue;
    }
    
    showUploadProgress(true, (completedFiles / totalFiles) * 100);
    setStatus("Uploading "+file.name+"...");
    
    const base64=await toBase64(file);
    
    try{
      await post("upload",{
        type,
        name:file.name,
        mimeType:file.type||"application/octet-stream",
        data:base64
      });
    }catch(e){
      alert("Upload failed: "+file.name);
    }
    
    completedFiles++;
    showUploadProgress(true, (completedFiles / totalFiles) * 100);
  }
  
  showUploadProgress(false);
  document.getElementById(inputId).value="";
  await loadItems(type);
  setStatus("Ready");
}

function toBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(",")[1]);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escAttr(s){return esc(s)}
</script>
</body>
</html>
