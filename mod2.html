<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hammerjet Personal Storage</title>
<style>
*{box-sizing:border-box}:root{--bg:#f6f7f9;--card:#fff;--text:#17181a;--muted:#777;--border:#e3e5e8;--input:#d8dbe0;--accent:#17181a}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.app{max-width:1050px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
h1{font-size:22px;margin:0;font-weight:600}#status{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
#search{flex:1;min-width:220px;border:1px solid var(--input);border-radius:9px;padding:11px 13px;font:inherit;background:var(--card);color:var(--text)}
#theme{border:1px solid var(--input);border-radius:9px;padding:10px;background:var(--card);color:var(--text)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
nav button{border:1px solid var(--border);background:var(--card);color:var(--text);padding:14px 8px;border-radius:10px;cursor:pointer;font-size:14px}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}.panel.active{display:block}
.panel h2{font-size:18px;margin:0 0 18px}.field{margin-bottom:12px}
input,textarea{width:100%;border:1px solid var(--input);border-radius:8px;padding:11px;font:inherit;background:var(--card);color:var(--text)}
textarea{min-height:150px;resize:vertical}button.primary{background:var(--accent);color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}
.item{border-top:1px solid var(--border);padding:14px 0}.item:first-child{border-top:0}.item-title{font-weight:600;margin-bottom:5px}
.item-meta{font-size:12px;color:var(--muted);margin-top:7px}.item a{color:inherit}.empty{color:var(--muted);padding:18px 0}
.filebox{border:1px dashed #bbb;border-radius:10px;padding:22px;text-align:center;margin-bottom:12px}
@media(max-width:700px){nav{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app">
<header><h1>Hammerjet Personal Storage</h1><span id="status">Ready</span></header>
<div class="tools"><input id="search" type="search" placeholder="Search current category..." autocomplete="off">
<select id="theme"><option value="default">Classic</option><option value="blue">Blue</option><option value="green">Green</option><option value="warm">Warm</option></select></div>
<nav><button data-tab="photos">Photos</button><button data-tab="notes">Notes</button><button data-tab="links">Links</button><button data-tab="files">File Upload</button></nav>
<section id="photos" class="panel"><h2>Photos</h2><div class="filebox"><input id="photoInput" type="file" accept="image/*" multiple></div><button class="primary" onclick="uploadFiles('photoInput','photos')">Upload Photos</button><div id="photosList"></div></section>
<section id="notes" class="panel"><h2>Notes</h2><div class="field"><input id="noteTitle" placeholder="Title"></div><div class="field"><textarea id="noteBody" placeholder="Write your note..."></textarea></div><button class="primary" onclick="saveNote()">Save Note</button><div id="notesList"></div></section>
<section id="links" class="panel"><h2>Links</h2><div class="field"><input id="linkTitle" placeholder="Title"></div><div class="field"><input id="linkUrl" placeholder="https://example.com"></div><button class="primary" onclick="saveLink()">Save Link</button><div id="linksList"></div></section>
<section id="files" class="panel"><h2>File Upload</h2><div class="filebox"><input id="fileInput" type="file" multiple></div><button class="primary" onclick="uploadFiles('fileInput','files')">Upload Files</button><div id="filesList"></div></section>
</div><script>
const API_URL="https://script.google.com/macros/s/AKfycbxjvlQKAKFR6aO4ZhvpvesTtRhjdNVveBVfmdCkeYOjKWG4Fm-Jd-TAx3glB0ISBW2R/exec";let currentTab="photos",currentItems=[];
const themes={default:{bg:"#f6f7f9",card:"#fff",text:"#17181a",muted:"#777",border:"#e3e5e8",input:"#d8dbe0",accent:"#17181a"},blue:{bg:"#f3f7fc",card:"#fff",text:"#142033",muted:"#617089",border:"#dbe5f1",input:"#cbd8e8",accent:"#2457a6"},green:{bg:"#f3f8f5",card:"#fff",text:"#17241c",muted:"#637267",border:"#dce8df",input:"#cbdace",accent:"#24734a"},warm:{bg:"#faf7f2",card:"#fff",text:"#241d17",muted:"#7c7167",border:"#e9dfd5",input:"#dacfc5",accent:"#9a5a24"}};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.getElementById(currentTab).classList.add("active");document.getElementById("search").value="";loadItems(currentTab)});
document.getElementById("search").oninput=()=>render(currentTab,filterItems(currentItems,document.getElementById("search").value));
document.getElementById("theme").onchange=e=>{Object.entries(themes[e.target.value]).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k,v));localStorage.setItem("hammerjetTheme",e.target.value)};
document.getElementById("theme").value=localStorage.getItem("hammerjetTheme")||"default";document.getElementById("theme").dispatchEvent(new Event("change"));document.querySelector('nav button[data-tab="photos"]').click();
function setStatus(t){document.getElementById("status").textContent=t}
async function post(action,data={}){const r=await fetch(API_URL,{method:"POST",body:new URLSearchParams({action,...data})});const x=await r.json();if(!x.ok)throw Error(x.error||"Request failed");return x}
async function loadItems(type){if(!API_URL||API_URL.includes("PASTE_NEW_"))return;setStatus("Loading...");const cb="cb_"+Date.now(),s=document.createElement("script");window[cb]=x=>{delete window[cb];s.remove();if(!x.ok){setStatus("Load error");return}currentItems=x.items||[];render(type,currentItems);setStatus("Ready")};s.onerror=()=>{s.remove();setStatus("Load error")};s.src=API_URL+"?action=list&type="+encodeURIComponent(type)+"&callback="+cb;document.body.appendChild(s)}
function filterItems(items,q){q=String(q||"").trim().toLowerCase();return !q?items:items.filter(x=>[x.title,x.body,x.url,x.name,x.fileUrl,x.date].some(v=>String(v||"").toLowerCase().includes(q)))}
function render(type,items){const el=document.getElementById(type+"List");if(!items.length){el.innerHTML='<div class="empty">Nothing found.</div>';return}el.innerHTML=items.map(x=>type==="notes"?`<div class="item"><div class="item-title">${esc(x.title)}</div><div>${esc(x.body)}</div><div class="item-meta">${esc(x.date||"")}</div></div>`:`<div class="item"><div class="item-title">${esc(x.title||x.name||"File")}</div>${x.url?`<a href="${escAttr(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>`:""}${!x.url&&x.fileUrl?`<a href="${escAttr(x.fileUrl)}" target="_blank" rel="noopener">Open file</a>`:""}<div class="item-meta">${esc(x.date||"")}</div></div>`).join("")}
async function saveLink(){const title=linkTitle.value.trim(),url=linkUrl.value.trim();if(!title||!url)return alert("Enter title and URL.");setStatus("Saving...");try{await post("save",{type:"links",title,url});linkTitle.value="";linkUrl.value="";await loadItems("links")}catch(e){setStatus("Save error")}}
async function saveNote(){const title=noteTitle.value.trim(),body=noteBody.value.trim();if(!title||!body)return alert("Enter title and note.");setStatus("Saving...");try{await post("save",{type:"notes",title,body});noteTitle.value="";noteBody.value="";await loadItems("notes")}catch(e){setStatus("Save error")}}
async function uploadFiles(id,type){const files=[...document.getElementById(id).files];if(!files.length)return alert("Choose a file first.");for(const file of files){if(file.size>20*1024*1024){alert(file.name+" is over the 20 MB per-file limit.");continue}setStatus("Uploading "+file.name+"...");const base64=await toBase64(file);try{await post("upload",{type,name:file.name,mimeType:file.type||"application/octet-stream",data:base64})}catch(e){alert("Upload failed: "+file.name)}}document.getElementById(id).value="";await loadItems(type);setStatus("Ready")}
function toBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f)})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function escAttr(s){return esc(s)}
</script></body></html>
